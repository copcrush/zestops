[project]
name = "zestops-monitoring-api"
version = "0.1.0"
description = "ZestOps Monitoring API: approved service health checks and incident management"
readme = "CLAUDE.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.38",
    "pydantic>=2.14",
    "pydantic-settings>=2.12",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.32",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.15",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.0",
    "ruff>=0.17",
    "mypy>=2.4",
    "pip-audit>=2.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "RUF", "ASYNC", "PT", "TID"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# assert is the normal way to write pytest checks; tests also use fake secrets.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
