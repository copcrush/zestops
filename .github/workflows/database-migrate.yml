# Apply SQL migrations to a deployed database. Manual on purpose: schema changes
# are a deliberate human step, never automatic on application start (ADR-0003).
# Only "up" and "version" are possible; there is no reset or down migration here.
name: Database migrate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment holding the DATABASE_OWNER_URL secret
        type: choice
        options: [production]
        default: production
      command:
        description: "up = apply pending migrations, version = show current versions"
        type: choice
        options: [version, up]
        default: version

permissions:
  contents: read

concurrency:
  group: database-migrate-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Environment protection rules (required reviewers) can gate this job.
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Normalize and validate DATABASE_OWNER_URL (never printed)
        env:
          RAW_DATABASE_OWNER_URL: ${{ secrets.DATABASE_OWNER_URL }}
        run: |
          # Tolerate common copy/paste mistakes: "Value:" prefix, quotes, spaces, CR/LF.
          cleaned=$(printf '%s' "$RAW_DATABASE_OWNER_URL" | tr -d '\r\n' \
            | sed -E 's/^[[:space:]]*(Value:)?[[:space:]]*//; s/[[:space:]]+$//; s/^["'\'']//; s/["'\'']$//')
          if [ -z "$cleaned" ]; then
            echo "::error::Secret DATABASE_OWNER_URL is empty or not configured for this environment."
            exit 1
          fi
          echo "::add-mask::$cleaned"
          case "$cleaned" in
            postgresql://*|postgres://*) ;;
            *)
              echo "::error::DATABASE_OWNER_URL must start with postgresql:// (it starts with '$(printf '%s' "$cleaned" | cut -c1-6 | sed 's/[^A-Za-z:/]/?/g')...', length ${#cleaned}). Paste only the text from postgresql:// to sslmode=require."
              exit 1
              ;;
          esac
          case "$cleaned" in
            *" "*) echo "::error::DATABASE_OWNER_URL contains a space. Paste it again as one line."; exit 1 ;;
          esac
          echo "DATABASE_OWNER_URL=$cleaned" >> "$GITHUB_ENV"
          echo "Secret looks like a PostgreSQL URL (length ${#cleaned})."
      - name: Check that the database was bootstrapped (STEP A)
        run: |
          bootstrapped=$(psql "$DATABASE_OWNER_URL" -tAc \
            "SELECT count(*) FROM pg_namespace WHERE nspname IN ('identity','payments','monitoring','zestops_migrations')")
          database_name=$(psql "$DATABASE_OWNER_URL" -tAc "SELECT current_database()")
          if [ "$bootstrapped" != "4" ]; then
            echo "::error::Database '$database_name' is not bootstrapped (found $bootstrapped of 4 schemas). Run infra/database/bootstrap/bootstrap.sql (STEP A) on this same database first, then re-run this workflow."
            exit 1
          fi
          echo "Database '$database_name' is bootstrapped."
      - name: Run migrations (${{ inputs.command }})
        run: |
          export MIGRATION_DATABASE_URLS="$DATABASE_OWNER_URL"
          docker run --rm \
            -v "$PWD/infra/database/migrations:/migrations:ro" \
            -v "$PWD/infra/database/scripts:/scripts:ro" \
            -e MIGRATION_DATABASE_URLS \
            --entrypoint /bin/sh migrate/migrate:v4.20.1 /scripts/migrate.sh "${{ inputs.command }}"
